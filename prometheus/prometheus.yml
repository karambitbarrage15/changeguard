global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "telemetry-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["telemetry-service:8000", "localhost:8000"]
        labels:
          service: "connected-vehicle-telemetry"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
