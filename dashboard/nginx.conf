server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy telemetry API
    location /api/telemetry/ {
        proxy_pass http://telemetry-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy risk engine
    location /api/risk/ {
        proxy_pass http://risk-engine:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy MCP
    location /api/mcp/ {
        proxy_pass http://mcp-server:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy SRE agent
    location /api/agent/ {
        proxy_pass http://sre-agent:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy RAG engine
    location /api/rag/ {
        proxy_pass http://rag-engine:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
