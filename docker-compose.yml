version: '3.8'

services:
  telemetry-service:
    build:
      context: ./services/telemetry_service
      dockerfile: Dockerfile
    container_name: changeguard-telemetry
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  risk-engine:
    build:
      context: ./risk_engine
      dockerfile: Dockerfile
    container_name: changeguard-risk-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: changeguard-mcp-server
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - PROMETHEUS_URL=http://prometheus:9090
      - TELEMETRY_URL=http://telemetry-service:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  rag-engine:
    build:
      context: ./rag_engine
      dockerfile: Dockerfile
    container_name: changeguard-rag-engine
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
    volumes:
      - ./rag_engine/knowledge_base:/app/knowledge_base
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  sre-agent:
    build:
      context: ./sre_agent
      dockerfile: Dockerfile
    container_name: changeguard-sre-agent
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - MCP_SERVER_URL=http://mcp-server:8002
      - RAG_ENGINE_URL=http://rag-engine:8004
      - PROMETHEUS_URL=http://prometheus:9090
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - mcp-server
      - rag-engine
      - prometheus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: changeguard-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - telemetry-service
      - risk-engine
      - sre-agent

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: changeguard-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: changeguard-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeguard
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
